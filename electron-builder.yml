appId: dev.orcastrate.app
productName: Orcastrate
directories:
  buildResources: build
  output: release

files:
  - out/**
  - package.json
  - '!**/*.map'

# better-sqlite3 ships Node-API prebuilds, so it needs no rebuild — but the
# .node binary must stay outside the asar archive to be loadable.
asarUnpack:
  - node_modules/better-sqlite3/**

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development
